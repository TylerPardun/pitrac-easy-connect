name: Test, build, and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the job that publishes a release is given write.
permissions:
  contents: read

# A tag usually points at a commit that is already on main, so both events
# fire and one commit ends up carrying two runs. Naming the jobs by which kind
# of run they belong to keeps a passing branch check from sitting next to a
# failing release check of exactly the same name.
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v')
      && format('Release {0}', github.ref_name)
      || format('CI on {0}', github.ref_name) }}

# A new push makes the run before it irrelevant. Cancelling saves the runner
# time and the artifact storage that a superseded run would keep for a week.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: >-
      test${{ startsWith(github.ref, 'refs/tags/v') && ' [release]' || '' }}
      (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macOS stands in for the Pi during development, Windows is the app's
        # real target, and Linux is the closest runner to the enclosure itself.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Easy Connect is deliberately dependency-free: the Pi install needs no
      # pip packages at all. pytest is the only build-time addition.
      # The extra is the one place the suite's requirements are written down,
      # so CI and a contributor's machine cannot drift apart.
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PiTrac-windows
            path: dist/PiTrac-Easy-Connect-windows.zip
          - os: macos-latest
            artifact: PiTrac-macos
            path: dist/PiTrac-Easy-Connect-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      # Pinned. Unpinned, the packaged app changes between builds and the
      # licences in NOTICE.md stop describing what actually shipped.
      - run: python -m pip install --upgrade pip
      # pillow is pinned in the file; installing it again unpinned defeated that.
      - run: python -m pip install -r packaging/build-requirements.txt

      - name: Generate icons
        run: python packaging/icon/make-icons.py packaging/icon

      - name: Build the macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/icon/PiTrac.iconset -o packaging/icon/PiTrac.icns

      # Before the build, so the file PyInstaller embeds and the zips
      # carry is this platform's own list. Generated afterwards, Windows
      # shipped the macOS dependencies that happened to be checked in.
      - name: Collect third-party licence texts
        run: python packaging/collect-licences.py

      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/PiTrac-Easy-Connect.spec

      # A .app is a directory, and uploading it directly loses the executable
      # bit, which leaves a download that cannot be opened.
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          # The licences travel beside the app as well as inside it. A onefile
          # build hides its bundled copies inside the archive, which satisfies
          # nothing if somebody actually wants to read them.
          mkdir -p dist/payload
          cp -R "dist/PiTrac Easy-Connect.app" dist/payload/
          cp LICENSE NOTICE.md dist/payload/
          cp THIRD-PARTY-LICENCES.txt dist/payload/
          ditto -c -k --keepParent dist/payload dist/PiTrac-Easy-Connect-macos.zip

      # A bare .exe cannot carry a licence file, so it travels in a zip with one.
      - name: Package the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/payload | Out-Null
          Copy-Item "dist/PiTrac Easy-Connect.exe" dist/payload/
          Copy-Item LICENSE, NOTICE.md dist/payload/
          Copy-Item THIRD-PARTY-LICENCES.txt dist/payload/
          Compress-Archive -Path dist/payload/* -DestinationPath dist/PiTrac-Easy-Connect-windows.zip -Force

      # Built and never run is not the same as working. The macOS app is
      # exercised by hand here; this is the only thing that touches Windows.
      - name: Check the Windows app actually starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/PiTrac Easy-Connect.exe" `
            -ArgumentList "--no-browser","--port","8899" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/status" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "started:" ($r.Content | ConvertFrom-Json).version
                $ok = $true; break
              }
            } catch { }
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "the Windows app did not start"; exit 1 }

      # The check above proves the packaged backend runs. It says nothing
      # about the part Windows users actually see, because --no-browser never
      # reaches pywebview or WebView2. This one unpacks the zip that gets
      # published and opens the real window.
      #
      # What it asserts is that WebView2 started: the runtime runs as msedge
      # child processes of the app, so their presence means pywebview loaded
      # the runtime and handed it the page. A window handle would be a nicer
      # thing to check, but this runner has no interactive desktop and reports
      # none even when the window exists -- confirmed by watching WebView2
      # start here while MainWindowHandle stayed zero. Whether the window is
      # usable is a question for a real machine; see docs/windows-testing.md.
      - name: Check the real window opens from the published zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path dist/PiTrac-Easy-Connect-windows.zip `
            -DestinationPath dist/unpacked -Force
          $exe = Get-ChildItem dist/unpacked -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "no executable inside the release zip"; exit 1 }
          Write-Host "launching $($exe.FullName)"

          $app = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--window","--port","8898" -PassThru

          $serving = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/status" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $serving = $true; break }
            } catch { }
          }

          # WebView2 takes a moment longer than the server it displays.
          $webview = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            $app.Refresh()
            if ($app.HasExited) { break }
            $kids = Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                    Where-Object { $_.ParentProcessId -eq $app.Id }
            if ($kids) {
              Write-Host "WebView2 running as $(@($kids).Count) child process(es)"
              $webview = $true; break
            }
          }
          $app.Refresh()
          if (-not $app.HasExited -and $app.MainWindowHandle -ne 0) {
            Write-Host "window title: '$($app.MainWindowTitle)'"
          } else {
            Write-Host "no window handle, as expected on a runner with no desktop"
          }

          $exited = $app.HasExited
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

          if ($exited)       { Write-Error "the app exited on its own"; exit 1 }
          if (-not $serving) { Write-Error "the app never answered /api/status"; exit 1 }
          if (-not $webview) {
            Write-Error ("the app served but never started WebView2, so the window " +
                         "it is supposed to draw in never existed")
            exit 1
          }
          Write-Host "the packaged app started its native window"

      - name: Check NOTICE.md credits everything the build bundles
        run: python packaging/bundled-licences.py --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          # These exist to hand the build to the release job in the same run.
          # Once a release is published they are a duplicate of its assets, so
          # the default ninety days is ninety days of storing them twice.
          retention-days: 7

  portable:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      # The portable build is plain Python, so it is the same file everywhere.
      - run: ./packaging/build-app.sh --pyz

      # This file is the Linux download, and nothing else in the matrix proves
      # the app itself starts on Linux — the tests exercise the library, not
      # the packaged artifact. So start it and ask it how it is.
      - name: Check the portable build runs on Linux
        run: |
          python3 dist/*.pyz --no-browser --port 8899 &
          for _ in $(seq 1 20); do
            sleep 1
            if curl -fsS -m 3 http://127.0.0.1:8899/api/status -o status.json; then
              break
            fi
          done
          python3 -c "
          import json, sys
          status = json.load(open('status.json'))
          print('started, version', status['version'])
          sys.exit(0 if status['version'] else 1)
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: PiTrac-portable
          path: dist/*.pyz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, portable]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything back to the repository.
      contents: write
      # Signing. id-token lets this job prove to Sigstore which workflow, at
      # which commit, produced these files; attestations lets it record the
      # result against the repository so anyone can check it later.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: The tag must match the version in the package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pitrac_easy_connect/__init__.py').read_text()).group(1))")
          echo "tag $TAG, package $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match the package version $PKG."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      # Every downloadable file gathered into one directory, so the checksums
      # and the signatures cover exactly the set that gets published.
      - name: Gather what is being released
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.pyz' \) -exec cp {} release/ \;
          ls -l release

      - name: Write the checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signs the files themselves, keylessly, through Sigstore: the signature
      # records the workflow, repository and commit that built them, and is
      # checkable with `gh attestation verify`. This is not a code-signing
      # certificate -- it does not quiet SmartScreen or Gatekeeper -- but it is
      # what proves a download came from this repository's own build.
      - name: Sign the release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.pyz

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: release/*
          generate_release_notes: true
          # What the signing does and does not do, said where people download.
          body: |
            Download the build for your computer.

            **Windows** — `PiTrac-Easy-Connect-windows.zip`. Unzip it, then Windows will warn that
            it does not recognise the program; choose **More info**, then
            **Run anyway**.

            **macOS** — `PiTrac-Easy-Connect-macos.zip`. Unzip it, then
            right-click the app and choose **Open** the first time.

            **Linux** — the `.pyz` runs on any computer with Python 3.9 or
            newer, without installation.

            ### Checking what you downloaded

            Every file here is signed at build time, and `SHA256SUMS.txt`
            lists the checksums. To confirm a download came from this
            repository's own build, with the [GitHub CLI](https://cli.github.com):

            ```
            gh attestation verify PiTrac-Easy-Connect-windows.zip --repo TylerPardun/pitrac-easy-connect
            ```

            That reports the workflow, the commit, and the run that produced
            the file. To check the bytes alone, compare against
            `SHA256SUMS.txt` — `sha256sum -c SHA256SUMS.txt` on Linux,
            `shasum -a 256 -c SHA256SUMS.txt` on macOS, or
            `Get-FileHash` on Windows.

            This is not a code-signing certificate, so Windows and macOS still
            warn about the app as described above. Those warnings need a paid
            certificate from Microsoft's and Apple's programmes; the signing
            here proves where the file came from, which is the part that can
            be done without one.

            The enclosure checks the same thing for itself: it refuses an
            update whose bytes do not match the checksum this release
            publishes.

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so
      # without contents:read the checkout of a private repository fails with
      # "repository not found", which is what happened.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
