name: Test, build, and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the job that publishes a release is given write.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS stands in for the Pi during development, Windows is the app's
        # real target, and Linux is the closest runner to the enclosure itself.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Easy Connect is deliberately dependency-free: the Pi install needs no
      # pip packages at all. pytest is the only build-time addition.
      - run: python -m pip install . pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PiTrac-windows
            path: dist/PiTrac-Easy-Connect-windows.zip
          - os: macos-latest
            artifact: PiTrac-macos
            path: dist/PiTrac-Easy-Connect-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned. Unpinned, the packaged app changes between builds and the
      # licences in NOTICE.md stop describing what actually shipped.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r packaging/build-requirements.txt pillow

      - name: Generate icons
        run: python packaging/icon/make-icons.py packaging/icon

      - name: Build the macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/icon/PiTrac.iconset -o packaging/icon/PiTrac.icns

      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/PiTrac-Easy-Connect.spec

      # A .app is a directory, and uploading it directly loses the executable
      # bit, which leaves a download that cannot be opened.
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          # The licences travel beside the app as well as inside it. A onefile
          # build hides its bundled copies inside the archive, which satisfies
          # nothing if somebody actually wants to read them.
          mkdir -p dist/payload
          cp -R "dist/PiTrac Easy-Connect.app" dist/payload/
          cp LICENSE NOTICE.md dist/payload/
          [ -f THIRD-PARTY-LICENCES.txt ] && cp THIRD-PARTY-LICENCES.txt dist/payload/ || true
          ditto -c -k --keepParent dist/payload dist/PiTrac-Easy-Connect-macos.zip

      # A bare .exe cannot carry a licence file, so it travels in a zip with one.
      - name: Package the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/payload | Out-Null
          Copy-Item "dist/PiTrac Easy-Connect.exe" dist/payload/
          Copy-Item LICENSE, NOTICE.md dist/payload/
          if (Test-Path THIRD-PARTY-LICENCES.txt) {
            Copy-Item THIRD-PARTY-LICENCES.txt dist/payload/
          }
          Compress-Archive -Path dist/payload/* -DestinationPath dist/PiTrac-Easy-Connect-windows.zip -Force

      - name: Check NOTICE.md credits everything the build bundles
        run: python packaging/bundled-licences.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  portable:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The portable build is plain Python, so it is the same file everywhere.
      - run: ./packaging/build-app.sh --pyz

      # This file is the Linux download, and nothing else in the matrix proves
      # the app itself starts on Linux — the tests exercise the library, not
      # the packaged artifact. So start it and ask it how it is.
      - name: Check the portable build runs on Linux
        run: |
          python3 dist/*.pyz --no-browser --port 8899 &
          for _ in $(seq 1 20); do
            sleep 1
            if curl -fsS -m 3 http://127.0.0.1:8899/api/status -o status.json; then
              break
            fi
          done
          python3 -c "
          import json, sys
          status = json.load(open('status.json'))
          print('started, version', status['version'])
          sys.exit(0 if status['version'] else 1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: PiTrac-portable
          path: dist/*.pyz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, portable]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything back to the repository.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Neither build is signed yet, so say so where people download them.
          body: |
            Download the build for your computer.

            **Windows** — `PiTrac-Easy-Connect-windows.zip`. Unzip it, then Windows will warn that
            it does not recognise the program; choose **More info**, then
            **Run anyway**.

            **macOS** — `PiTrac-Easy-Connect-macos.zip`. Unzip it, then
            right-click the app and choose **Open** the first time.

            **Any computer with Python 3.9+** — the `.pyz` runs without
            installation.

            Neither build is code-signed yet, which is why both operating
            systems warn about them.

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so
      # without contents:read the checkout of a private repository fails with
      # "repository not found", which is what happened.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
