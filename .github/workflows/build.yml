name: Test, build, and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the job that publishes a release is given write.
permissions:
  contents: read

# A tag usually points at a commit that is already on main, so both events
# fire and one commit ends up carrying two runs. Naming the jobs by which kind
# of run they belong to keeps a passing branch check from sitting next to a
# failing release check of exactly the same name.
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v')
      && format('Release {0}', github.ref_name)
      || format('CI on {0}', github.ref_name) }}

# A new push makes the run before it irrelevant. Cancelling saves the runner
# time and the artifact storage that a superseded run would keep for a week.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: >-
      test${{ startsWith(github.ref, 'refs/tags/v') && ' [release]' || '' }}
      (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macOS stands in for the Pi during development, Windows is the app's
        # real target, and Linux is the closest runner to the enclosure itself.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Easy Connect is deliberately dependency-free: the Pi install needs no
      # pip packages at all. pytest is the only build-time addition.
      # The extra is the one place the suite's requirements are written down,
      # so CI and a contributor's machine cannot drift apart.
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python packaging/check-native-only.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PiTrac-windows
            path: dist/PiTrac-Easy-Connect-windows.zip
          # Two Mac builds, because a Mac cannot run the other one's. Rosetta
          # translates Intel code to run on Apple silicon, never the reverse,
          # so an Intel Mac given the arm64 build has no way to start it at all.
          - os: macos-latest
            artifact: PiTrac-macos-apple-silicon
            path: dist/PiTrac-Easy-Connect-macos-apple-silicon.zip
          - os: macos-15-intel
            artifact: PiTrac-macos-intel
            path: dist/PiTrac-Easy-Connect-macos-intel.zip
          - os: ubuntu-latest
            artifact: PiTrac-linux-x86_64
            path: dist/PiTrac-Easy-Connect-linux-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Pinned. Unpinned, the packaged app changes between builds and the
      # licences in NOTICE.md stop describing what actually shipped.
      - run: python -m pip install --upgrade pip
      - name: Install the Linux native-window toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcairo2-dev libgirepository-2.0-dev \
            gir1.2-girepository-2.0 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-dev xvfb
      # pillow is pinned in the file; installing it again unpinned defeated that.
      - run: python -m pip install -r packaging/build-requirements.txt

      - name: Generate icons
        run: python packaging/icon/make-icons.py packaging/icon

      - name: Build the macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/icon/PiTrac.iconset -o packaging/icon/PiTrac.icns

      # Before the build, so the file PyInstaller embeds and the zips
      # carry is this platform's own list. Generated afterwards, Windows
      # shipped the macOS dependencies that happened to be checked in.
      - name: Collect third-party licence texts
        run: python packaging/collect-licences.py

      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/app packaging/PiTrac-Easy-Connect.spec
          python -m PyInstaller --noconfirm --clean --distpath dist-helper --workpath build/helper packaging/PiTrac-Updater.spec

      - name: Build a disposable v0.4.5 application for the N to N+1 updater test
        shell: bash
        run: |
          OLD_SOURCE="$RUNNER_TEMP/pitrac-old-source"
          mkdir -p "$OLD_SOURCE"
          cp -R src/pitrac_easy_connect "$OLD_SOURCE/"
          OLD_INIT="$OLD_SOURCE/pitrac_easy_connect/__init__.py"
          python - "$OLD_INIT" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          path.write_text(re.sub(r'__version__ = "[^"]+"', '__version__ = "0.4.5"', path.read_text()))
          PY
          PITRAC_SOURCE_ROOT="$OLD_SOURCE" PITRAC_VERSION=0.4.5 \
            python -m PyInstaller --noconfirm --clean --distpath dist-old \
            --workpath build/old packaging/PiTrac-Easy-Connect.spec

      # A .app is a directory, and uploading it directly loses the executable
      # bit, which leaves a download that cannot be opened.
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          VERSION=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          mkdir -p "dist/PiTrac Easy-Connect.app/Contents/Helpers"
          cp "dist-helper/PiTrac Updater" "dist/PiTrac Easy-Connect.app/Contents/Helpers/"
          chmod +x "dist/PiTrac Easy-Connect.app/Contents/Helpers/PiTrac Updater"
          python packaging/write-install-manifest.py \
            "dist/PiTrac Easy-Connect.app/Contents/Resources/pitrac-install.json" \
            --version "$VERSION" --system Darwin --arch "$WANT"
          # Adding the separately-built helper changes the bundle, so refresh
          # the ad-hoc signature before packaging and verify it immediately.
          codesign --force --deep --sign - "dist/PiTrac Easy-Connect.app"
          codesign --verify --deep --strict "dist/PiTrac Easy-Connect.app"

          # The archive has one .app at its root plus deterministic legal files.
          mkdir -p dist/payload
          cp -R "dist/PiTrac Easy-Connect.app" dist/payload/
          cp LICENSE NOTICE.md dist/payload/
          cp THIRD-PARTY-LICENCES.txt dist/payload/
          ditto -c -k --norsrc --noextattr dist/payload/ "${{ matrix.path }}"

          # The architecture is the whole reason there are two of these, so it
          # is worth failing the build rather than shipping the wrong one under
          # the right name.
          BUILT=$(lipo -archs "dist/PiTrac Easy-Connect.app/Contents/MacOS/PiTrac Easy-Connect")
          echo "built for: $BUILT"
          if [ "$BUILT" != "$WANT" ]; then
            echo "::error::${{ matrix.artifact }} should be $WANT but is $BUILT"
            exit 1
          fi

      - name: Check the exact macOS zip, page API, and single application
        if: runner.os == 'macOS'
        run: |
          ditto -x -k "${{ matrix.path }}" dist/unpacked
          APP=$(find dist/unpacked -maxdepth 3 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          EXPECTED=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          test -x "$BIN" || { echo "::error::the app executable bit was lost"; exit 1; }
          test -x "$APP/Contents/Helpers/PiTrac Updater" || { echo "::error::the helper is missing"; exit 1; }
          python packaging/check-release-archive.py "${{ matrix.path }}" \
            --system Darwin --arch "$WANT" --version "$EXPECTED"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Contents/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$APP/Contents/Info.plist" | grep -q true
          RESOURCE_COUNT=$(find "$APP/Contents" -type f \( -name LICENSE -o -name NOTICE.md -o -name THIRD-PARTY-LICENCES.txt \) | tee /tmp/mac-resources.txt | wc -l | tr -d ' ')
          cat /tmp/mac-resources.txt
          test "$RESOURCE_COUNT" -eq 3 || {
            echo "::error::the app must contain exactly the three required legal resources"; exit 1;
          }

          BROWSERS_BEFORE=$(pgrep -x 'Safari|Google Chrome|Firefox' 2>/dev/null | sort || true)
          echo "launching $BIN"
          "$BIN" --port 8899 --smoke-test --config /tmp/pitrac-mac-smoke.json >/tmp/mac-window.log 2>&1 &
          APP_PID=$!

          STATUS=""
          PAGE_CHECK=""
          for i in $(seq 1 40); do
            sleep 2
            STATUS=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/status || true)
            PAGE_CHECK=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check || true)
            if echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup'; then
              break
            fi
          done

          if [ -z "$STATUS" ]; then
            echo "::error::the packaged app never answered /api/status"
            exit 1
          fi
          echo "$STATUS" | tr ',' '\n' | grep -i "state\|detail" || true
          echo "$STATUS" | grep -q '"version":"'"$EXPECTED"'"' || {
            echo "::error::the packaged app did not report version $EXPECTED"; exit 1;
          }
          if ! echo "$STATUS" | grep -qE '"state": *"native"'; then
            echo "::error::the app did not report a created native window"
            exit 1
          fi
          echo "$PAGE_CHECK" | grep -q 'POST /api/search' || {
            echo "::error::the real page did not call guarded search"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup' || {
            echo "::error::the real page did not complete its state-changing API smoke"; exit 1;
          }

          "$BIN" --port 8899 --config /tmp/pitrac-mac-smoke.json >/tmp/mac-second.log 2>&1 &
          SECOND_PID=$!
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $SECOND_PID 2>/dev/null || break
          done
          if kill -0 $SECOND_PID 2>/dev/null; then
            echo "::error::a second Easy-Connect process remained running"; exit 1
          fi
          wait $SECOND_PID
          kill -0 $APP_PID
          PAGE_CHECK=$(curl -fsS -m 5 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check)
          echo "$PAGE_CHECK" | grep -q 'POST /api/activate' || {
            echo "::error::the second launch did not activate the original window"; exit 1;
          }

          python - <<'PY'
          from AppKit import NSWorkspace
          apps = [a for a in NSWorkspace.sharedWorkspace().runningApplications()
                  if a.bundleIdentifier() == "com.pitrac.easyconnect"]
          print("Easy-Connect registrations:", [(a.processIdentifier(), a.activationPolicy()) for a in apps])
          if len(apps) != 1:
              raise SystemExit("expected exactly one Easy-Connect application registration")
          if int(apps[0].activationPolicy()) != 0:
              raise SystemExit("Easy-Connect is not registered as one foreground application")
          PY

          BROWSERS_AFTER=$(pgrep -x 'Safari|Google Chrome|Firefox' 2>/dev/null | sort || true)
          test "$BROWSERS_AFTER" = "$BROWSERS_BEFORE" || {
            echo "::error::the app launched an external browser"; exit 1;
          }
          curl -fsS -m 5 -H "X-PiTrac-App: 1" -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8899/api/quit >/dev/null
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $APP_PID 2>/dev/null || break
          done
          if kill -0 $APP_PID 2>/dev/null; then
            echo "::error::the macOS app did not exit cleanly"; exit 1
          fi
          wait $APP_PID
          cat /tmp/mac-window.log /tmp/mac-second.log || true
          echo "the exact macOS zip passed native page, single-instance, and browser checks"

      - name: Run a real packaged macOS v0.4.5 to candidate update transaction
        if: runner.os == 'macOS'
        run: |
          FIXTURE="$RUNNER_TEMP/pitrac-update-fixture"
          mkdir -p "$FIXTURE"
          cp -R "dist-old/PiTrac Easy-Connect.app" "$FIXTURE/"
          OLD_APP="$FIXTURE/PiTrac Easy-Connect.app"
          mkdir -p "$OLD_APP/Contents/Helpers"
          cp "dist-helper/PiTrac Updater" "$OLD_APP/Contents/Helpers/"
          chmod +x "$OLD_APP/Contents/Helpers/PiTrac Updater"
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          python packaging/write-install-manifest.py \
            "$OLD_APP/Contents/Resources/pitrac-install.json" \
            --version 0.4.5 --system Darwin --arch "$WANT"
          codesign --force --deep --sign - "$OLD_APP"
          TARGET=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          ASSET=$(basename "${{ matrix.path }}")
          python packaging/packaged-update-smoke.py \
            --old-root "$OLD_APP" --archive "${{ matrix.path }}" \
            --old-version 0.4.5 --target-version "$TARGET" \
            --system Darwin --arch "$WANT" --asset "$ASSET"

      # A bare .exe cannot carry a licence file, so it travels in a zip with one.
      - name: Package the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist/payload/PiTrac Easy-Connect"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/PiTrac Easy-Connect.exe" $root/
          Copy-Item "dist-helper/PiTrac Updater.exe" $root/
          Copy-Item LICENSE, NOTICE.md $root/
          Copy-Item THIRD-PARTY-LICENCES.txt $root/
          $version = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          python packaging/write-install-manifest.py "$root/pitrac-install.json" `
            --version $version --system Windows --arch x86_64
          Compress-Archive -Path $root -DestinationPath dist/PiTrac-Easy-Connect-windows.zip -Force

      - name: Package the disposable Windows physical-test fixture
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $root = "dist/physical-old/PiTrac Easy-Connect"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist-old/PiTrac Easy-Connect.exe" $root/
          Copy-Item "dist-helper/PiTrac Updater.exe" $root/
          Copy-Item LICENSE, NOTICE.md, THIRD-PARTY-LICENCES.txt $root/
          python packaging/write-install-manifest.py "$root/pitrac-install.json" `
            --version 0.4.5 --system Windows --arch x86_64
          Compress-Archive -Path $root `
            -DestinationPath dist/PiTrac-Easy-Connect-windows-physical-old.zip -Force

      - name: Retain the disposable Windows physical-test fixture
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PiTrac-windows-physical-old
          path: dist/PiTrac-Easy-Connect-windows-physical-old.zip
          if-no-files-found: error
          retention-days: 1

      # Unpack the exact zip that gets published and use its normal launch path.
      # What it asserts is that WebView2 started: the runtime runs as msedge
      # child processes of the app, so their presence means pywebview loaded
      # the runtime and handed it the page. A window handle would be a nicer
      # thing to check, but this runner has no interactive desktop and reports
      # none even when the window exists -- confirmed by watching WebView2
      # start here while MainWindowHandle stayed zero. Whether the window is
      # usable is a question for a real machine; see docs/windows-testing.md.
      - name: Check the real window opens from the published zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path dist/PiTrac-Easy-Connect-windows.zip `
            -DestinationPath dist/unpacked -Force
          $exe = Get-ChildItem dist/unpacked -Recurse -Filter "PiTrac Easy-Connect.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "no executable inside the release zip"; exit 1 }
          $expected = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          python packaging/check-release-archive.py dist/PiTrac-Easy-Connect-windows.zip `
            --system Windows --arch x86_64 --version $expected
          Write-Host "launching $($exe.FullName)"

          $app = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--port","8898","--smoke-test","--config","$env:TEMP\pitrac-windows-smoke.json" -PassThru

          $serving = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/status" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $serving = $true; break }
            } catch { }
          }

          # WebView2 takes a moment longer than the server it displays, and it
          # is not a direct child: PyInstaller's onefile bootloader unpacks and
          # then runs the real app as its own child, so the msedge processes
          # are grandchildren. Walk the whole tree rather than one level.
          function Get-Descendants([int]$rootId) {
            $all = Get-CimInstance Win32_Process |
                   Select-Object ProcessId, ParentProcessId, Name
            $seen = @{ $rootId = $true }
            # Repeated passes because a child can appear in the list before its
            # parent has been recognised as part of the tree.
            for ($pass = 0; $pass -lt 6; $pass++) {
              foreach ($proc in $all) {
                if ($seen.ContainsKey([int]$proc.ParentProcessId)) {
                  $seen[[int]$proc.ProcessId] = $true
                }
              }
            }
            $all | Where-Object { $seen.ContainsKey([int]$_.ProcessId) -and
                                  [int]$_.ProcessId -ne $rootId }
          }

          # The two cases are told apart by the process name, and the previous
          # version of this check got it exactly wrong. The WebView2 runtime
          # runs as msedgewebview2.exe. A browser opened because the window
          # failed runs as msedge.exe -- and since Edge is the default browser
          # on this image, looking for "msedge" matched the failure and called
          # it success, which is how a release went out where every packaged
          # build opened a browser.
          $webview = $false
          $browser = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            $app.Refresh()
            if ($app.HasExited) { break }
            $tree = Get-Descendants $app.Id
            if ($tree | Where-Object { $_.Name -eq "msedgewebview2.exe" }) {
              $n = @($tree | Where-Object { $_.Name -eq "msedgewebview2.exe" }).Count
              Write-Host "WebView2 running as $n process(es)"
              $webview = $true; break
            }
            if ($tree | Where-Object { $_.Name -eq "msedge.exe" }) { $browser = $true }
          }
          if ($browser) {
            Write-Host "Edge started as an ordinary browser under the app."
          }
          if (-not $webview) {
            Write-Host "processes under the app when giving up:"
            Get-Descendants $app.Id | ForEach-Object { Write-Host "  $($_.Name) ($($_.ProcessId))" }
          }

          # And the app's own account of it, which does not rely on guessing
          # from process names at all.
          $windowState = "unknown"
          try {
            $s = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/status" `
                  -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
            $reported = $s.Content | ConvertFrom-Json
            $w = $reported.window
            $windowState = $w.state
            Write-Host "the app reports: state=$($w.state) detail=$($w.detail)"
            $expected = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
            if ($reported.version -ne $expected) {
              Write-Error "the packaged app reported $($reported.version), expected $expected"
              exit 1
            }
          } catch { Write-Host "could not read the window state back" }
          $app.Refresh()
          if (-not $app.HasExited -and $app.MainWindowHandle -ne 0) {
            Write-Host "window title: '$($app.MainWindowTitle)'"
          } else {
            Write-Host "no window handle, as expected on a runner with no desktop"
          }

          $pageReady = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $p = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/page-check" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              $requests = ($p.Content | ConvertFrom-Json).requests
              if ($requests.'POST /api/search' -ge 1 -and
                  $requests.'POST /api/finish-setup' -ge 1) {
                $pageReady = $true; break
              }
            } catch { }
          }

          # The second executable must ask the original window to activate and
          # then exit, leaving the original server and WebView2 tree intact.
          $second = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--port","8898","--config","$env:TEMP\pitrac-windows-smoke.json" -PassThru
          if (-not $second.WaitForExit(15000)) {
            Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
            Write-Error "a second Easy-Connect process remained running"; exit 1
          }
          if ($second.ExitCode -ne 0) {
            Write-Error "the second launch exited $($second.ExitCode)"; exit 1
          }
          $app.Refresh()
          if ($app.HasExited) { Write-Error "the original app exited after second launch"; exit 1 }
          $p = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/page-check" `
                -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
          $requests = ($p.Content | ConvertFrom-Json).requests
          if ($requests.'POST /api/activate' -lt 1) {
            Write-Error "the second launch did not activate the original window"; exit 1
          }

          $exited = $app.HasExited

          if ($exited)       { Write-Error "the app exited on its own"; exit 1 }
          if (-not $serving) { Write-Error "the app never answered /api/status"; exit 1 }
          if ($windowState -ne "native") {
            Write-Error "the app did not report a created native window"
            exit 1
          }
          if (-not $webview) {
            Write-Error ("the app served but never started an embedded WebView2, so " +
                         "the window it is supposed to draw in never existed")
            exit 1
          }
          if ($browser) {
            Write-Error "the app launched ordinary Edge in addition to its embedded window"
            exit 1
          }
          if (-not $pageReady) {
            Write-Error "the real packaged page did not complete guarded search and state change"
            exit 1
          }

          Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/quit" -Method POST `
            -Headers @{"X-PiTrac-App"="1"} -ContentType "application/json" `
            -Body "{}" -UseBasicParsing -TimeoutSec 5 | Out-Null
          if (-not $app.WaitForExit(15000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Write-Error "the app did not exit cleanly"; exit 1
          }
          Write-Host "the exact Windows zip passed native page and single-instance checks"

      - name: Run a real packaged Windows v0.4.5 to candidate update transaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = "$env:RUNNER_TEMP\pitrac-update-fixture\PiTrac Easy-Connect"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Copy-Item "dist-old/PiTrac Easy-Connect.exe" $fixture/
          Copy-Item "dist-helper/PiTrac Updater.exe" $fixture/
          Copy-Item LICENSE, NOTICE.md, THIRD-PARTY-LICENCES.txt $fixture/
          python packaging/write-install-manifest.py "$fixture/pitrac-install.json" `
            --version 0.4.5 --system Windows --arch x86_64
          $target = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          python packaging/packaged-update-smoke.py `
            --old-root $fixture --archive dist/PiTrac-Easy-Connect-windows.zip `
            --old-version 0.4.5 --target-version $target --system Windows `
            --arch x86_64 --asset PiTrac-Easy-Connect-windows.zip

      - name: Package the Linux app
        if: runner.os == 'Linux'
        run: |
          ROOT="dist/payload/PiTrac Easy-Connect"
          mkdir -p "$ROOT"
          cp "dist/PiTrac Easy-Connect" "$ROOT/"
          cp "dist-helper/PiTrac Updater" "$ROOT/"
          cp LICENSE NOTICE.md THIRD-PARTY-LICENCES.txt "$ROOT/"
          chmod +x "$ROOT/PiTrac Easy-Connect" "$ROOT/PiTrac Updater"
          VERSION=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          python packaging/write-install-manifest.py "$ROOT/pitrac-install.json" \
            --version "$VERSION" --system Linux --arch x86_64
          (cd dist/payload && zip -yr ../PiTrac-Easy-Connect-linux-x86_64.zip "PiTrac Easy-Connect")

      - name: Check the Linux release opens a WebKitGTK window
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/unpacked-linux
          unzip -q dist/PiTrac-Easy-Connect-linux-x86_64.zip -d dist/unpacked-linux
          BIN="dist/unpacked-linux/PiTrac Easy-Connect/PiTrac Easy-Connect"
          test -x "$BIN" || { echo "::error::the Linux executable bit was lost"; exit 1; }
          EXPECTED=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          python packaging/check-release-archive.py dist/PiTrac-Easy-Connect-linux-x86_64.zip \
            --system Linux --arch x86_64 --version "$EXPECTED"
          BROWSERS_BEFORE=$(pgrep -x 'firefox|chromium|google-chrome' 2>/dev/null | sort || true)
          # Both launches must share one desktop session. Wrapping only the
          # first process in xvfb-run leaves the second with no DISPLAY, so it
          # cannot execute the focus request the test is meant to verify.
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'cat linux-window.log linux-second.log xvfb.log 2>/dev/null || true; kill $XVFB_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X99 ]; then break; fi
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X99 || { echo "::error::Xvfb did not start"; exit 1; }
          "$BIN" --port 8899 --smoke-test --config /tmp/pitrac-linux-smoke.json >linux-window.log 2>&1 &
          APP_PID=$!
          STATUS=""
          PAGE_CHECK=""
          for _ in $(seq 1 40); do
            sleep 2
            STATUS=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/status || true)
            PAGE_CHECK=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check || true)
            if echo "$STATUS" | grep -qE '"state": *"native"' && \
               echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup'; then
              break
            fi
          done
          echo "$STATUS" | grep -qE '"state": *"native"' || {
            echo "::error::the Linux artifact did not create a native WebKitGTK window"
            exit 1
          }
          echo "$STATUS" | grep -q '"version":"'"$EXPECTED"'"' || {
            echo "::error::the Linux artifact reported the wrong version"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q 'POST /api/search' || {
            echo "::error::the real Linux page did not call guarded search"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup' || {
            echo "::error::the real Linux page did not call a state-changing route"; exit 1;
          }

          "$BIN" --port 8899 --config /tmp/pitrac-linux-smoke.json >linux-second.log 2>&1 &
          SECOND_PID=$!
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $SECOND_PID 2>/dev/null || break
          done
          if kill -0 $SECOND_PID 2>/dev/null; then
            echo "::error::a second Linux app process remained running"; exit 1
          fi
          if ! wait $SECOND_PID; then
            cat linux-second.log || true
            echo "::error::the second Linux launch exited with a failure"; exit 1
          fi
          kill -0 $APP_PID
          for _ in $(seq 1 20); do
            PAGE_CHECK=$(curl -fsS -m 5 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check)
            if echo "$PAGE_CHECK" | grep -q '"completed":1'; then break; fi
            sleep 0.25
          done
          echo "$PAGE_CHECK" | grep -q 'POST /api/activate' || {
            echo "::error::the second Linux launch did not activate the original"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q '"completed":1' || {
            echo "::error::the Linux window did not complete its native activation"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q '"error":null' || {
            echo "::error::the Linux native activation reported an error: $PAGE_CHECK"; exit 1;
          }
          BROWSERS_AFTER=$(pgrep -x 'firefox|chromium|google-chrome' 2>/dev/null | sort || true)
          test "$BROWSERS_AFTER" = "$BROWSERS_BEFORE" || {
            echo "::error::the Linux app launched an external browser"; exit 1;
          }
          curl -fsS -m 5 -H "X-PiTrac-App: 1" -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8899/api/quit >/dev/null
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $APP_PID 2>/dev/null || break
          done
          if kill -0 $APP_PID 2>/dev/null; then
            echo "::error::the Linux app did not exit cleanly"; exit 1
          fi
          wait $APP_PID
          trap - EXIT
          kill $XVFB_PID 2>/dev/null || true
          wait $XVFB_PID 2>/dev/null || true
          cat linux-window.log linux-second.log xvfb.log || true

      - name: Run a real packaged Linux v0.4.5 to candidate update transaction
        if: runner.os == 'Linux'
        run: |
          FIXTURE="$RUNNER_TEMP/pitrac-update-fixture/PiTrac Easy-Connect"
          mkdir -p "$FIXTURE"
          cp "dist-old/PiTrac Easy-Connect" "$FIXTURE/"
          cp "dist-helper/PiTrac Updater" "$FIXTURE/"
          cp LICENSE NOTICE.md THIRD-PARTY-LICENCES.txt "$FIXTURE/"
          chmod +x "$FIXTURE/PiTrac Easy-Connect" "$FIXTURE/PiTrac Updater"
          python packaging/write-install-manifest.py "$FIXTURE/pitrac-install.json" \
            --version 0.4.5 --system Linux --arch x86_64
          TARGET=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          xvfb-run -a python packaging/packaged-update-smoke.py \
            --old-root "$FIXTURE" --archive dist/PiTrac-Easy-Connect-linux-x86_64.zip \
            --old-version 0.4.5 --target-version "$TARGET" --system Linux \
            --arch x86_64 --asset PiTrac-Easy-Connect-linux-x86_64.zip

      - name: Check NOTICE.md credits everything the build bundles
        run: python packaging/bundled-licences.py --check --toc build/app/PiTrac-Easy-Connect/Analysis-00.toc

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          # These exist to hand the build to the release job in the same run.
          # Once a release is published they are a duplicate of its assets, so
          # the default ninety days is ninety days of storing them twice.
          retention-days: 7

  pi-archive:
    name: Raspberry Pi service archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and check the Pi-service archive
        run: |
          ./packaging/build-pi-archive.sh
          VERSION=$(PYTHONPATH=src python3 -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          ARCHIVE="dist/PiTrac-Easy-Connect-$VERSION.pyz"
          python3 "$ARCHIVE" --version
          python3 -m zipfile -t "$ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PiTrac-pi-service
          path: dist/PiTrac-Easy-Connect-*.pyz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pi-archive]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything back to the repository.
      contents: write
      # Signing. id-token lets this job prove to Sigstore which workflow, at
      # which commit, produced these files; attestations lets it record the
      # result against the repository so anyone can check it later.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release notes are read from this tag's own annotation,
          # and a shallow checkout does not bring the tag object with it.
          fetch-depth: 0
      - name: The tag must match the version in the package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pitrac_easy_connect/__init__.py').read_text()).group(1))")
          echo "tag $TAG, package $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match the package version $PKG."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      # Every downloadable file gathered into one directory, so the checksums
      # and the signatures cover exactly the set that gets published.
      - name: Gather what is being released
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.pyz' \) -exec cp {} release/ \;
          EXPECTED=(
            PiTrac-Easy-Connect-macos-apple-silicon.zip
            PiTrac-Easy-Connect-macos-intel.zip
            PiTrac-Easy-Connect-windows.zip
            PiTrac-Easy-Connect-linux-x86_64.zip
            "PiTrac-Easy-Connect-${GITHUB_REF_NAME#v}.pyz"
          )
          [ "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#EXPECTED[@]}" ]
          for asset in "${EXPECTED[@]}"; do test -s "release/$asset"; done
          ls -l release

      - name: Write the checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signs the files themselves, keylessly, through Sigstore: the signature
      # records the workflow, repository and commit that built them, and is
      # checkable with `gh attestation verify`. This is not a code-signing
      # certificate -- it does not quiet SmartScreen or Gatekeeper -- but it is
      # what proves a download came from this repository's own build.
      - name: Sign the release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.pyz

      # The notes for a release are the message on its own tag, which is
      # where they are written. This used to point at a file named for
      # v0.4.6, so every release since carried v0.4.6's notes -- telling
      # people about upgrading from v0.4.5 no matter which version they had
      # just downloaded.
      - name: Assemble the release notes from this tag
        run: |
          mkdir -p /tmp/notes
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/notes/body.md
          if [ ! -s /tmp/notes/body.md ]; then
            echo "::error::${GITHUB_REF_NAME} has no annotation, so it has no notes."
            exit 1
          fi
          printf '\n\n' >> /tmp/notes/body.md
          cat .github/release-notes/download-and-verify.md >> /tmp/notes/body.md
          echo "--- notes for ${GITHUB_REF_NAME} ---"
          head -20 /tmp/notes/body.md

      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
          body_path: /tmp/notes/body.md

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so
      # without contents:read the checkout of a private repository fails with
      # "repository not found", which is what happened.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
