name: Test, build, and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the job that publishes a release is given write.
permissions:
  contents: read

# A tag usually points at a commit that is already on main, so both events
# fire and one commit ends up carrying two runs. Naming the jobs by which kind
# of run they belong to keeps a passing branch check from sitting next to a
# failing release check of exactly the same name.
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v')
      && format('Release {0}', github.ref_name)
      || format('CI on {0}', github.ref_name) }}

# A new push makes the run before it irrelevant. Cancelling saves the runner
# time and the artifact storage that a superseded run would keep for a week.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: >-
      test${{ startsWith(github.ref, 'refs/tags/v') && ' [release]' || '' }}
      (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macOS stands in for the Pi during development, Windows is the app's
        # real target, and Linux is the closest runner to the enclosure itself.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Easy Connect is deliberately dependency-free: the Pi install needs no
      # pip packages at all. pytest is the only build-time addition.
      # The extra is the one place the suite's requirements are written down,
      # so CI and a contributor's machine cannot drift apart.
      - run: python -m pip install ".[test]"
      # Windows Defender's real-time scanner holds a transient lock on a
      # freshly written or renamed file while it scans it, and under the
      # parallel load pytest-xdist puts on a temp directory full of small
      # executable-flagged fixtures, that lock can outlast a generous retry
      # window -- surfacing as PermissionError/WinError 5 on an ordinary
      # directory rename that already checked its destination was empty.
      # Excluding pytest's own temp path is the standard mitigation; nothing
      # the application does in production is exempted by this.
      - name: Exclude the test temp directory from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:TEMP"
      - run: python -m pytest -q
      - run: python packaging/check-native-only.py

  build:
    needs: test
    # Branch/PR builds enter an unprotected environment with no secrets and
    # therefore remain unsigned. A release-tag build enters the protected
    # release environment, which is the only place the platform certificates
    # exist. Without this job-level environment, `${{ secrets.* }}` below can
    # never see environment secrets and every release is silently unsigned.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PiTrac-windows
            # Two files: the zip is what the updater fetches and replaces a
            # directory from, the installer is what a person downloads.
            path: |
              dist/PiTrac-Easy-Connect-windows.zip
              dist/PiTrac-Easy-Connect-windows-setup.exe
            signingStatus: dist/signing-status-windows.json
            sbomPlatform: windows
          # Two Mac builds, because a Mac cannot run the other one's. Rosetta
          # translates Intel code to run on Apple silicon, never the reverse,
          # so an Intel Mac given the arm64 build has no way to start it at all.
          - os: macos-latest
            artifact: PiTrac-macos-apple-silicon
            path: dist/PiTrac-Easy-Connect-macos-apple-silicon.zip
            signingStatus: dist/signing-status-macos-apple-silicon.json
            sbomPlatform: macos-apple-silicon
          - os: macos-15-intel
            artifact: PiTrac-macos-intel
            path: dist/PiTrac-Easy-Connect-macos-intel.zip
            signingStatus: dist/signing-status-macos-intel.json
            sbomPlatform: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Pinned. Unpinned, the packaged app changes between builds and the
      # licences in NOTICE.md stop describing what actually shipped.
      - run: python -m pip install --upgrade pip
      # pillow is pinned in the file; installing it again unpinned defeated that.
      - run: python -m pip install -r packaging/build-requirements.txt

      - name: Generate icons
        run: python packaging/icon/make-icons.py packaging/icon

      - name: Build the macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/icon/PiTrac.iconset -o packaging/icon/PiTrac.icns

      # Before the build, so the file PyInstaller embeds and the zips
      # carry is this platform's own list. Generated afterwards, Windows
      # shipped the macOS dependencies that happened to be checked in.
      - name: Collect third-party licence texts
        run: python packaging/collect-licences.py

      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/app packaging/PiTrac-Easy-Connect.spec
          python -m PyInstaller --noconfirm --clean --distpath dist-helper --workpath build/helper packaging/PiTrac-Updater.spec

      - name: Download the actual preceding release when one exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          set +e
          PREVIOUS_TAG=$(python packaging/select-update-baseline.py \
            "$RUNNER_TEMP/releases.json" "$TARGET")
          SELECT_STATUS=$?
          set -e
          if [ "$SELECT_STATUS" -eq 3 ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::release-tag builds require a published lower-version updater baseline"
              exit 1
            fi
            echo "HAS_UPDATE_BASELINE=false" >> "$GITHUB_ENV"
            echo "::notice::No lower release exists; v0.9.0 is the fresh release-history baseline. Upgrade smoke resumes after the next version bump."
            exit 0
          elif [ "$SELECT_STATUS" -ne 0 ]; then
            exit "$SELECT_STATUS"
          fi
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          case "${{ matrix.path }}" in
            *macos-apple-silicon*) OLD_ASSET=PiTrac-Easy-Connect-macos-apple-silicon.zip ;;
            *macos-intel*)         OLD_ASSET=PiTrac-Easy-Connect-macos-intel.zip ;;
            *windows*)             OLD_ASSET=PiTrac-Easy-Connect-windows.zip ;;
            *) echo "::error::unknown release platform"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$OLD_ASSET" --dir "$RUNNER_TEMP/previous-release"
          test -s "$RUNNER_TEMP/previous-release/$OLD_ASSET"
          {
            echo "HAS_UPDATE_BASELINE=true"
            echo "PREVIOUS_TAG=$PREVIOUS_TAG"
            echo "PREVIOUS_VERSION=$PREVIOUS_VERSION"
            echo "PREVIOUS_ASSET=$RUNNER_TEMP/previous-release/$OLD_ASSET"
          } >> "$GITHUB_ENV"
          echo "Updater baseline: exact published $PREVIOUS_TAG / $OLD_ASSET"

      # A .app is a directory, and uploading it directly loses the executable
      # bit, which leaves a download that cannot be opened.
      - name: Assemble the macOS app bundle
        if: runner.os == 'macOS'
        run: |
          VERSION=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          mkdir -p "dist/PiTrac Easy-Connect.app/Contents/Helpers"
          cp "dist-helper/PiTrac Updater" "dist/PiTrac Easy-Connect.app/Contents/Helpers/"
          chmod +x "dist/PiTrac Easy-Connect.app/Contents/Helpers/PiTrac Updater"
          python packaging/write-install-manifest.py \
            "dist/PiTrac Easy-Connect.app/Contents/Resources/pitrac-install.json" \
            --version "$VERSION" --system Darwin --arch "$WANT"

          # The architecture is the whole reason there are two of these, so it
          # is worth failing the build rather than signing and notarizing the
          # wrong one under the right name.
          BUILT=$(lipo -archs "dist/PiTrac Easy-Connect.app/Contents/MacOS/PiTrac Easy-Connect")
          echo "built for: $BUILT"
          if [ "$BUILT" != "$WANT" ]; then
            echo "::error::${{ matrix.artifact }} should be $WANT but is $BUILT"
            exit 1
          fi

      # A Developer ID certificate is a release-environment secret, so a fork's
      # pull request build -- which cannot see it -- has to keep building. What
      # changes is only whether it signs for real; see release-signing-gate.py
      # for what that means for whether the eventual release may call itself
      # final.
      - name: Import the Developer ID signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTIFICATE_P12 != ''
        env:
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" \
            >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported: $IDENTITY"

      # Signing inside-out: the helper first, since it is also copied
      # separately into the bundle the archive ships, then the whole bundle.
      # PyInstaller's own bundles are flat enough that --deep on the app after
      # its parts are already signed is the recipe PyInstaller's own packaging
      # documentation gives, despite Apple discouraging --deep in general for
      # bundles with independently-versioned nested components.
      - name: Sign the macOS app and its helper
        if: runner.os == 'macOS'
        run: |
          IDENTITY="${MACOS_SIGNING_IDENTITY:--}"
          HARDENED=()
          if [ "$IDENTITY" != "-" ]; then
            HARDENED=(--options runtime --timestamp --entitlements packaging/entitlements.plist)
          fi
          codesign --force --deep "${HARDENED[@]}" --sign "$IDENTITY" \
            "dist/PiTrac Easy-Connect.app/Contents/Helpers/PiTrac Updater"
          codesign --force --deep "${HARDENED[@]}" --sign "$IDENTITY" \
            "dist/PiTrac Easy-Connect.app"
          codesign --verify --deep --strict "dist/PiTrac Easy-Connect.app"
          codesign -dv --verbose=2 "dist/PiTrac Easy-Connect.app" 2>&1 | tail -5

      - name: Notarize and staple the macOS app
        if: >-
          runner.os == 'macOS' && env.MACOS_SIGNING_IDENTITY != '' &&
          env.AC_NOTARY_KEY_P8 != ''
        env:
          AC_NOTARY_KEY_ID: ${{ secrets.AC_NOTARY_KEY_ID }}
          AC_NOTARY_ISSUER_ID: ${{ secrets.AC_NOTARY_ISSUER_ID }}
          AC_NOTARY_KEY_P8: ${{ secrets.AC_NOTARY_KEY_P8 }}
        run: |
          echo "$AC_NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --norsrc --noextattr "dist/PiTrac Easy-Connect.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" --key-id "$AC_NOTARY_KEY_ID" \
            --issuer "$AC_NOTARY_ISSUER_ID" --wait --timeout 30m \
            | tee "$RUNNER_TEMP/notary-log.txt"
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/notarize.zip"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary-log.txt" || {
            echo "::error::notarization did not report Accepted"; exit 1;
          }
          xcrun stapler staple "dist/PiTrac Easy-Connect.app"
          xcrun stapler validate "dist/PiTrac Easy-Connect.app"
          echo "MACOS_NOTARIZED=true" >> "$GITHUB_ENV"

      # The archive is built only now, after stapling: the notarization
      # ticket has to be inside the zip a person downloads, not only inside
      # the copy that was submitted for notarization.
      - name: Assemble the macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/payload
          cp -R "dist/PiTrac Easy-Connect.app" dist/payload/
          cp LICENSE NOTICE.md dist/payload/
          cp THIRD-PARTY-LICENCES.txt dist/payload/
          ditto -c -k --norsrc --noextattr dist/payload/ "${{ matrix.path }}"

      - name: Verify signing and record what actually happened
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.path }}" in
            *apple-silicon*) PLATFORM=macos-apple-silicon ;;
            *intel*)         PLATFORM=macos-intel ;;
          esac
          SIGNED=false; NOTARIZED=false
          if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            SIGNED=true
            DETAIL="signed as $MACOS_SIGNING_IDENTITY"
          else
            DETAIL="no MACOS_SIGNING_CERTIFICATE_P12 secret is configured; ad-hoc signed only"
          fi
          if [ "${MACOS_NOTARIZED:-false}" = true ]; then
            NOTARIZED=true
            DETAIL="$DETAIL, notarized and stapled"
            spctl --assess --type execute -vvv "dist/PiTrac Easy-Connect.app"
          elif [ "$SIGNED" = true ]; then
            DETAIL="$DETAIL, but no AC_NOTARY_KEY_P8 secret is configured so it was not notarized"
          fi
          echo "$DETAIL"
          python packaging/write-signing-status.py \
            --out "dist/signing-status-$PLATFORM.json" --platform "$PLATFORM" \
            --signed "$SIGNED" --notarized "$NOTARIZED" --detail "$DETAIL"

      - name: Check the exact macOS zip, page API, and single application
        if: runner.os == 'macOS'
        run: |
          ditto -x -k "${{ matrix.path }}" dist/unpacked
          APP=$(find dist/unpacked -maxdepth 3 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          EXPECTED=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          test -x "$BIN" || { echo "::error::the app executable bit was lost"; exit 1; }
          test -x "$APP/Contents/Helpers/PiTrac Updater" || { echo "::error::the helper is missing"; exit 1; }
          python packaging/check-release-archive.py "${{ matrix.path }}" \
            --system Darwin --arch "$WANT" --version "$EXPECTED"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Contents/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$APP/Contents/Info.plist" | grep -q true
          RESOURCE_COUNT=$(find "$APP/Contents" -type f \( -name LICENSE -o -name NOTICE.md -o -name THIRD-PARTY-LICENCES.txt \) | tee /tmp/mac-resources.txt | wc -l | tr -d ' ')
          cat /tmp/mac-resources.txt
          test "$RESOURCE_COUNT" -eq 3 || {
            echo "::error::the app must contain exactly the three required legal resources"; exit 1;
          }

          BROWSERS_BEFORE=$(pgrep -x 'Safari|Google Chrome|Firefox' 2>/dev/null | sort || true)
          echo "launching $BIN"
          "$BIN" --port 8899 --smoke-test --config /tmp/pitrac-mac-smoke.json >/tmp/mac-window.log 2>&1 &
          APP_PID=$!

          STATUS=""
          PAGE_CHECK=""
          for i in $(seq 1 40); do
            sleep 2
            STATUS=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/status || true)
            PAGE_CHECK=$(curl -fsS -m 3 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check || true)
            if echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup'; then
              break
            fi
          done

          if [ -z "$STATUS" ]; then
            echo "::error::the packaged app never answered /api/status"
            exit 1
          fi
          echo "$STATUS" | tr ',' '\n' | grep -i "state\|detail" || true
          echo "$STATUS" | grep -q '"version":"'"$EXPECTED"'"' || {
            echo "::error::the packaged app did not report version $EXPECTED"; exit 1;
          }
          if ! echo "$STATUS" | grep -qE '"state": *"native"'; then
            echo "::error::the app did not report a created native window"
            exit 1
          fi
          echo "$PAGE_CHECK" | grep -q 'POST /api/search' || {
            echo "::error::the real page did not call guarded search"; exit 1;
          }
          echo "$PAGE_CHECK" | grep -q 'POST /api/finish-setup' || {
            echo "::error::the real page did not complete its state-changing API smoke"; exit 1;
          }

          "$BIN" --port 8899 --config /tmp/pitrac-mac-smoke.json >/tmp/mac-second.log 2>&1 &
          SECOND_PID=$!
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $SECOND_PID 2>/dev/null || break
          done
          if kill -0 $SECOND_PID 2>/dev/null; then
            echo "::error::a second Easy-Connect process remained running"; exit 1
          fi
          wait $SECOND_PID
          kill -0 $APP_PID
          PAGE_CHECK=$(curl -fsS -m 5 -H "X-PiTrac-App: 1" http://127.0.0.1:8899/api/page-check)
          echo "$PAGE_CHECK" | grep -q 'POST /api/activate' || {
            echo "::error::the second launch did not activate the original window"; exit 1;
          }

          python - <<'PY'
          from AppKit import NSWorkspace
          apps = [a for a in NSWorkspace.sharedWorkspace().runningApplications()
                  if a.bundleIdentifier() == "com.pitrac.easyconnect"]
          print("Easy-Connect registrations:", [(a.processIdentifier(), a.activationPolicy()) for a in apps])
          if len(apps) != 1:
              raise SystemExit("expected exactly one Easy-Connect application registration")
          if int(apps[0].activationPolicy()) != 0:
              raise SystemExit("Easy-Connect is not registered as one foreground application")
          PY

          BROWSERS_AFTER=$(pgrep -x 'Safari|Google Chrome|Firefox' 2>/dev/null | sort || true)
          test "$BROWSERS_AFTER" = "$BROWSERS_BEFORE" || {
            echo "::error::the app launched an external browser"; exit 1;
          }
          curl -fsS -m 5 -H "X-PiTrac-App: 1" -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8899/api/quit >/dev/null
          for _ in $(seq 1 20); do
            sleep 0.5
            kill -0 $APP_PID 2>/dev/null || break
          done
          if kill -0 $APP_PID 2>/dev/null; then
            echo "::error::the macOS app did not exit cleanly"; exit 1
          fi
          wait $APP_PID
          cat /tmp/mac-window.log /tmp/mac-second.log || true
          echo "the exact macOS zip passed native page, single-instance, and browser checks"

      - name: Run the actual preceding macOS release to candidate update
        if: runner.os == 'macOS' && env.HAS_UPDATE_BASELINE == 'true'
        env:
          PITRAC_RELEASE_SIGNING_KEY: ${{ secrets.PITRAC_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$PITRAC_RELEASE_SIGNING_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::tag smoke requires PITRAC_RELEASE_SIGNING_KEY from the release environment"
              exit 1
            fi
            echo "Signed packaged-update smoke is deferred to the protected release-tag build."
            echo "Pull requests cannot access the production release-manifest key."
            exit 0
          fi
          FIXTURE="$RUNNER_TEMP/pitrac-update-fixture"
          mkdir -p "$FIXTURE"
          ditto -x -k "$PREVIOUS_ASSET" "$FIXTURE"
          OLD_APP=$(find "$FIXTURE" -maxdepth 2 -name "PiTrac Easy-Connect.app" | head -1)
          test -n "$OLD_APP" -a -x "$OLD_APP/Contents/MacOS/PiTrac Easy-Connect"
          case "${{ matrix.path }}" in
            *apple-silicon*) WANT=arm64 ;;
            *intel*)         WANT=x86_64 ;;
          esac
          OLD_BUILT=$(lipo -archs "$OLD_APP/Contents/MacOS/PiTrac Easy-Connect")
          test "$OLD_BUILT" = "$WANT" || {
            echo "::error::$PREVIOUS_TAG artifact is $OLD_BUILT, expected $WANT"; exit 1;
          }
          TARGET=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          ASSET=$(basename "${{ matrix.path }}")
          umask 077
          printf '%s' "$PITRAC_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          python packaging/packaged-update-smoke.py \
            --old-root "$OLD_APP" --archive "${{ matrix.path }}" \
            --old-version "$PREVIOUS_VERSION" --target-version "$TARGET" \
            --system Darwin --arch "$WANT" --asset "$ASSET" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem"
          if [ -f "$RUNNER_TEMP/release-signing-key.pem" ]; then
            rm -f "$RUNNER_TEMP/release-signing-key.pem"
          fi

      # The main Windows executable is onefile so it cannot be separated from
      # its Python runtime. The surrounding directory remains the installed
      # package because it also carries the updater and install manifest.
      - name: Package the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist/payload/PiTrac Easy-Connect"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/PiTrac Easy-Connect.exe" $root/
          if (-not (Test-Path "$root/PiTrac Easy-Connect.exe")) {
            Write-Error "the self-contained Windows executable was not produced"; exit 1
          }
          Copy-Item "dist-helper/PiTrac Updater.exe" $root/
          Copy-Item LICENSE, NOTICE.md $root/
          Copy-Item THIRD-PARTY-LICENCES.txt $root/
          Copy-Item packaging/WINDOWS-INSTALLATION.txt $root/
          $version = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          python packaging/write-install-manifest.py "$root/pitrac-install.json" `
            --version $version --system Windows --arch x86_64

      # An Authenticode certificate is a release-environment secret, so a
      # fork's pull request build -- which cannot see it -- has to keep
      # building unsigned. What changes is only whether release-signing-gate.py
      # later lets the eventual release call itself final.
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERTIFICATE_PFX != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_PFX)
          $pfx = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "WINDOWS_SIGNING_CERTIFICATE_PATH=$pfx" >> $env:GITHUB_ENV

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe was not found on this runner"; exit 1 }
          "WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign the Windows app and helper
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERTIFICATE_PATH != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $root = "dist/payload/PiTrac Easy-Connect"
          & $env:WINDOWS_SIGNTOOL_PATH sign /f $env:WINDOWS_SIGNING_CERTIFICATE_PATH `
            /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 `
            "$root/PiTrac Easy-Connect.exe" "$root/PiTrac Updater.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed"; exit 1 }
          & $env:WINDOWS_SIGNTOOL_PATH verify /pa /v "$root/PiTrac Easy-Connect.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "the signed app executable did not verify"; exit 1 }
          & $env:WINDOWS_SIGNTOOL_PATH verify /pa /v "$root/PiTrac Updater.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "the signed helper did not verify"; exit 1 }
          "WINDOWS_APP_SIGNED=true" >> $env:GITHUB_ENV

      - name: Compress the Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist/payload/PiTrac Easy-Connect"
          Compress-Archive -Path $root -DestinationPath dist/PiTrac-Easy-Connect-windows.zip -Force

      # The zip stays: it is what the updater downloads, and self-update is
      # built around replacing the directory inside it. The installer is for
      # people. Inno Setup is already on this image. Signing the exe and helper
      # before this runs is what makes the installer's own payload, unpacked
      # from the SourceDir Inno reads, signed too.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup is not on this runner"; exit 1 }
          & $iscc "/DAppVersion=$version" packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "the installer did not build"; exit 1 }
          $setup = "dist/PiTrac-Easy-Connect-windows-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "the installer was not produced"; exit 1 }
          Write-Host ("installer: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB))

      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERTIFICATE_PATH != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $setup = "dist/PiTrac-Easy-Connect-windows-setup.exe"
          & $env:WINDOWS_SIGNTOOL_PATH sign /f $env:WINDOWS_SIGNING_CERTIFICATE_PATH `
            /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 $setup
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed on the installer"; exit 1 }
          & $env:WINDOWS_SIGNTOOL_PATH verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) { Write-Error "the signed installer did not verify"; exit 1 }
          "WINDOWS_INSTALLER_SIGNED=true" >> $env:GITHUB_ENV
          Remove-Item -Force $env:WINDOWS_SIGNING_CERTIFICATE_PATH -ErrorAction SilentlyContinue

      - name: Record what Windows signing actually did
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signed = ($env:WINDOWS_APP_SIGNED -eq "true") -and ($env:WINDOWS_INSTALLER_SIGNED -eq "true")
          if ($signed) {
            $detail = "app, helper, and installer Authenticode-signed and verified with signtool"
          } elseif ($env:WINDOWS_SIGNING_CERTIFICATE_PATH -ne $null -and $env:WINDOWS_SIGNING_CERTIFICATE_PATH -ne "") {
            $detail = "a signing certificate was configured but signing or verification did not complete for every file"
          } else {
            $detail = "no WINDOWS_SIGNING_CERTIFICATE_PFX secret is configured; unsigned"
          }
          Write-Host $detail
          python packaging/write-signing-status.py --out dist/signing-status-windows.json `
            --platform windows --signed $(if ($signed) { "true" } else { "false" }) --detail $detail

      # Installing for real, then checking the application landed where the
      # updater will look for it. /VERYSILENT is Inno's unattended mode.
      - name: Check the installer puts the app where updates can replace it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist/PiTrac-Easy-Connect-windows-setup.exe"
          $root = "$env:RUNNER_TEMP\installed-here\PiTrac Easy-Connect"
          $log = "$env:RUNNER_TEMP\install.log"
          # The path contains a space, so the value has to carry its own
          # quotes: an unquoted /DIR= was split at the space and the install
          # went somewhere else entirely, reported only as a missing exe.
          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
                         ('/DIR="{0}"' -f $root), ('/LOG="{0}"' -f $log))
          $run = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          Write-Host "installer exit code: $($run.ExitCode)"
          if ($run.ExitCode -ne 0) {
            Get-Content $log -Tail 30 -ErrorAction SilentlyContinue
            Write-Error "the installer did not complete"; exit 1
          }
          foreach ($needed in @("PiTrac Easy-Connect.exe","PiTrac Updater.exe",
                                "pitrac-install.json","WINDOWS-INSTALLATION.txt")) {
            if (-not (Test-Path "$root\$needed")) {
              Write-Host "installed into ${root}:"
              Get-ChildItem $root -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
              Get-Content $log -Tail 30 -ErrorAction SilentlyContinue
              Write-Error "the installed application has no $needed"; exit 1
            }
          }
          # The updater refuses anything that is not its own package layout,
          # so the installed directory is put through that exact check.
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from pitrac_easy_connect.companion import self_update
          root = sys.argv[1]
          app = self_update.validate_install_root(root, system='Windows', machine='x86_64')
          print('the installed directory is a replaceable install:', app.install_root)
          " "$root"
          if ($LASTEXITCODE -ne 0) { Write-Error "the installed layout is not updatable"; exit 1 }

      # Unpack the exact zip that gets published and use its normal launch path.
      # What it asserts is that WebView2 started: the runtime runs as msedge
      # child processes of the app, so their presence means pywebview loaded
      # the runtime and handed it the page. A window handle would be a nicer
      # thing to check, but this runner has no interactive desktop and reports
      # none even when the window exists -- confirmed by watching WebView2
      # start here while MainWindowHandle stayed zero. Whether the window is
      # usable is a question for a real machine; see docs/windows-testing.md.
      - name: Check the real window opens from the published zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path dist/PiTrac-Easy-Connect-windows.zip `
            -DestinationPath dist/unpacked -Force
          $exe = Get-ChildItem dist/unpacked -Recurse -Filter "PiTrac Easy-Connect.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "no executable inside the release zip"; exit 1 }
          $expected = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          python packaging/check-release-archive.py dist/PiTrac-Easy-Connect-windows.zip `
            --system Windows --arch x86_64 --version $expected
          Write-Host "launching $($exe.FullName)"

          $app = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--port","8898","--smoke-test","--config","$env:TEMP\pitrac-windows-smoke.json" -PassThru

          $serving = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/status" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $serving = $true; break }
            } catch { }
          }

          # WebView2 takes a moment longer than the server it displays, and it
          # is not a direct child: PyInstaller's onefile bootloader unpacks and
          # then runs the real app as its own child, so the msedge processes
          # are grandchildren. Walk the whole tree rather than one level.
          function Get-Descendants([int]$rootId) {
            $all = Get-CimInstance Win32_Process |
                   Select-Object ProcessId, ParentProcessId, Name
            $seen = @{ $rootId = $true }
            # Repeated passes because a child can appear in the list before its
            # parent has been recognised as part of the tree.
            for ($pass = 0; $pass -lt 6; $pass++) {
              foreach ($proc in $all) {
                if ($seen.ContainsKey([int]$proc.ParentProcessId)) {
                  $seen[[int]$proc.ProcessId] = $true
                }
              }
            }
            $all | Where-Object { $seen.ContainsKey([int]$_.ProcessId) -and
                                  [int]$_.ProcessId -ne $rootId }
          }

          # The two cases are told apart by the process name, and the previous
          # version of this check got it exactly wrong. The WebView2 runtime
          # runs as msedgewebview2.exe. A browser opened because the window
          # failed runs as msedge.exe -- and since Edge is the default browser
          # on this image, looking for "msedge" matched the failure and called
          # it success, which is how a release went out where every packaged
          # build opened a browser.
          $webview = $false
          $browser = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            $app.Refresh()
            if ($app.HasExited) { break }
            $tree = Get-Descendants $app.Id
            if ($tree | Where-Object { $_.Name -eq "msedgewebview2.exe" }) {
              $n = @($tree | Where-Object { $_.Name -eq "msedgewebview2.exe" }).Count
              Write-Host "WebView2 running as $n process(es)"
              $webview = $true; break
            }
            if ($tree | Where-Object { $_.Name -eq "msedge.exe" }) { $browser = $true }
          }
          if ($browser) {
            Write-Host "Edge started as an ordinary browser under the app."
          }
          if (-not $webview) {
            Write-Host "processes under the app when giving up:"
            Get-Descendants $app.Id | ForEach-Object { Write-Host "  $($_.Name) ($($_.ProcessId))" }
          }

          # And the app's own account of it, which does not rely on guessing
          # from process names at all.
          $windowState = "unknown"
          try {
            $s = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/status" `
                  -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
            $reported = $s.Content | ConvertFrom-Json
            $w = $reported.window
            $windowState = $w.state
            Write-Host "the app reports: state=$($w.state) detail=$($w.detail)"
            $expected = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
            if ($reported.version -ne $expected) {
              Write-Error "the packaged app reported $($reported.version), expected $expected"
              exit 1
            }
          } catch { Write-Host "could not read the window state back" }
          $app.Refresh()
          if (-not $app.HasExited -and $app.MainWindowHandle -ne 0) {
            Write-Host "window title: '$($app.MainWindowTitle)'"
          } else {
            Write-Host "no window handle, as expected on a runner with no desktop"
          }

          # Ninety seconds, not thirty. A cold Windows runner starting Python,
          # a local server and a WebView2 tree from a bundle written moments
          # earlier does not reliably get two POSTs away inside thirty, and
          # v0.5.1 failed here on the same code that had just passed on main.
          # This is the same mistake as the forty-five second restart
          # deadline: a slow start read as a failure.
          $pageReady = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            try {
              $p = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/page-check" `
                    -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
              $requests = ($p.Content | ConvertFrom-Json).requests
              if ($requests.'POST /api/search' -ge 1 -and
                  $requests.'POST /api/finish-setup' -ge 1) {
                $pageReady = $true; break
              }
            } catch { }
          }

          # The second executable must ask the original window to activate and
          # then exit, leaving the original server and WebView2 tree intact.
          $second = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--port","8898","--config","$env:TEMP\pitrac-windows-smoke.json" -PassThru
          if (-not $second.WaitForExit(15000)) {
            Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
            Write-Error "a second Easy-Connect process remained running"; exit 1
          }
          if ($second.ExitCode -ne 0) {
            Write-Error "the second launch exited $($second.ExitCode)"; exit 1
          }
          $app.Refresh()
          if ($app.HasExited) { Write-Error "the original app exited after second launch"; exit 1 }
          $p = Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/page-check" `
                -Headers @{"X-PiTrac-App"="1"} -UseBasicParsing -TimeoutSec 5
          $requests = ($p.Content | ConvertFrom-Json).requests
          if ($requests.'POST /api/activate' -lt 1) {
            Write-Error "the second launch did not activate the original window"; exit 1
          }

          $exited = $app.HasExited

          if ($exited)       { Write-Error "the app exited on its own"; exit 1 }
          if (-not $serving) { Write-Error "the app never answered /api/status"; exit 1 }
          if ($windowState -ne "native") {
            Write-Error "the app did not report a created native window"
            exit 1
          }
          if (-not $webview) {
            Write-Error ("the app served but never started an embedded WebView2, so " +
                         "the window it is supposed to draw in never existed")
            exit 1
          }
          if ($browser) {
            Write-Error "the app launched ordinary Edge in addition to its embedded window"
            exit 1
          }
          if (-not $pageReady) {
            Write-Error "the real packaged page did not complete guarded search and state change"
            exit 1
          }

          Invoke-WebRequest -Uri "http://127.0.0.1:8898/api/quit" -Method POST `
            -Headers @{"X-PiTrac-App"="1"} -ContentType "application/json" `
            -Body "{}" -UseBasicParsing -TimeoutSec 5 | Out-Null
          if (-not $app.WaitForExit(15000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Write-Error "the app did not exit cleanly"; exit 1
          }
          Write-Host "the exact Windows zip passed native page and single-instance checks"

      - name: Run the actual preceding Windows release to candidate update
        if: runner.os == 'Windows' && env.HAS_UPDATE_BASELINE == 'true'
        shell: pwsh
        env:
          PITRAC_RELEASE_SIGNING_KEY: ${{ secrets.PITRAC_RELEASE_SIGNING_KEY }}
        run: |
          if ($env:PITRAC_RELEASE_SIGNING_KEY -eq "") {
            if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
              Write-Error "tag smoke requires PITRAC_RELEASE_SIGNING_KEY from the release environment"
              exit 1
            }
            Write-Host "Signed packaged-update smoke is deferred to the protected release-tag build."
            Write-Host "Pull requests cannot access the production release-manifest key."
            exit 0
          }
          $fixture = "$env:RUNNER_TEMP\pitrac-update-fixture\PiTrac Easy-Connect"
          New-Item -ItemType Directory -Force -Path (Split-Path $fixture) | Out-Null
          Expand-Archive -Path $env:PREVIOUS_ASSET -DestinationPath (Split-Path $fixture) -Force
          if (-not (Test-Path "$fixture\PiTrac Easy-Connect.exe")) {
            Write-Error "$env:PREVIOUS_TAG did not contain its actual app directory"; exit 1
          }
          $target = python -c "import sys;sys.path.insert(0,'src');import pitrac_easy_connect;print(pitrac_easy_connect.__version__)"
          $releaseKey = "$env:RUNNER_TEMP\release-signing-key.pem"
          [IO.File]::WriteAllText($releaseKey, $env:PITRAC_RELEASE_SIGNING_KEY)
          python packaging/packaged-update-smoke.py `
            --old-root $fixture --archive dist/PiTrac-Easy-Connect-windows.zip `
            --old-version $env:PREVIOUS_VERSION --target-version $target --system Windows `
            --arch x86_64 --asset PiTrac-Easy-Connect-windows.zip --signing-key $releaseKey
          Remove-Item -Force $releaseKey -ErrorAction SilentlyContinue

      - name: Check NOTICE.md credits everything the build bundles
        run: python packaging/bundled-licences.py --check --toc build/app/PiTrac-Easy-Connect/Analysis-00.toc

      # Reuses the exact same manifest reader the check above just passed, so
      # the SBOM cannot list anything that check did not already verify
      # against NOTICE.md -- see write-sbom.py's own docstring for why a
      # second, independent enumeration here would be worse than none.
      - name: Write this platform's SBOM
        shell: bash
        run: |
          VERSION=$(PYTHONPATH=src python -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          python packaging/write-sbom.py             --out "dist/sbom-${{ matrix.sbomPlatform }}.json"             --toc build/app/PiTrac-Easy-Connect/Analysis-00.toc             --component-name "PiTrac Easy-Connect" --component-version "$VERSION"             --platform "${{ matrix.sbomPlatform }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          # These exist to hand the build to the release job in the same run.
          # Once a release is published they are a duplicate of its assets, so
          # the default ninety days is ninety days of storing them twice.
          retention-days: 7

      # Published, unlike signing-status: an SBOM is meant to be downloaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.artifact }}
          path: dist/sbom-${{ matrix.sbomPlatform }}.json
          if-no-files-found: error
          retention-days: 7

      # A separate artifact, not part of matrix.path: it is read by
      # release-signing-gate.py, never published as a release download, and
      # keeping it apart means it never has to be excluded from the file
      # globs the release job uses to gather what actually gets published.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signing-status-${{ matrix.artifact }}
          path: ${{ matrix.signingStatus }}
          if-no-files-found: error
          retention-days: 7

  pi-archive:
    name: Raspberry Pi service archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and check the Pi-service archive
        run: |
          ./packaging/build-pi-archive.sh
          VERSION=$(PYTHONPATH=src python3 -c 'import pitrac_easy_connect; print(pitrac_easy_connect.__version__)')
          ARCHIVE="dist/PiTrac-Easy-Connect-$VERSION.pyz"
          python3 "$ARCHIVE" --version
          python3 -m zipfile -t "$ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PiTrac-pi-service
          path: dist/PiTrac-Easy-Connect-*.pyz
          if-no-files-found: error
          retention-days: 7

  # One stable required-check name covers every matrix build and the Pi
  # archive. Branch rulesets should require this instead of trying to pin
  # GitHub's generated matrix-context names, which change when the matrix does.
  quality-gate:
    name: release-ready
    if: always()
    needs: [test, build, pi-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every test and platform build
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PI_RESULT: ${{ needs.pi-archive.result }}
        run: |
          printf 'test=%s build=%s pi-archive=%s\n' "$TEST_RESULT" "$BUILD_RESULT" "$PI_RESULT"
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$PI_RESULT" = success

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pi-archive, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything back to the repository.
      contents: write
      # Signing. id-token lets this job prove to Sigstore which workflow, at
      # which commit, produced these files; attestations lets it record the
      # result against the repository so anyone can check it later.
      id-token: write
      attestations: write
    # The release manifest signing key lives only in this environment's
    # secrets -- see packaging/make-signing-key.py -- so only this job can
    # reach it, and an environment with required reviewers can gate it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release notes are read from this tag's own annotation,
          # and a shallow checkout does not bring the tag object with it.
          fetch-depth: 0
      - name: The tag must match the version in the package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pitrac_easy_connect/__init__.py').read_text()).group(1))")
          echo "tag $TAG, package $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match the package version $PKG."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      # Every downloadable file gathered into one directory, so the checksums
      # and the signatures cover exactly the set that gets published.
      - name: Gather what is being released
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.pyz' -o -name '*-setup.exe' \) \
            -exec cp {} release/ \;
          EXPECTED=(
            PiTrac-Easy-Connect-macos-apple-silicon.zip
            PiTrac-Easy-Connect-macos-intel.zip
            PiTrac-Easy-Connect-windows.zip
            PiTrac-Easy-Connect-windows-setup.exe
            "PiTrac-Easy-Connect-${GITHUB_REF_NAME#v}.pyz"
          )
          [ "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#EXPECTED[@]}" ]
          for asset in "${EXPECTED[@]}"; do test -s "release/$asset"; done
          ls -l release

      # Each platform's own SBOM, already checked against NOTICE.md before it
      # was ever written -- see write-sbom.py. Renamed on the way in so the
      # per-platform name survives the collapse from artifacts/sbom-<job>/.
      - name: Gather the per-platform SBOMs
        run: |
          for found in artifacts/sbom-*/sbom-*.json; do
            cp "$found" "release/$(basename "$found")"
          done
          ls -l release/sbom-*.json

      - name: Write the checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The checksums above are convenience, not authentication: they come
      # from the same job that built the files they describe, exactly the
      # thing an attacker positioned to serve a bad release would also serve.
      # The manifest and its detached signature are what an installer can
      # actually trust -- see common/release_manifest.py for why, and
      # SECURITY.md for what this depends on.
      - name: Write and sign the release manifest
        env:
          PITRAC_RELEASE_SIGNING_KEY: ${{ secrets.PITRAC_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$PITRAC_RELEASE_SIGNING_KEY" ]; then
            echo "::error::PITRAC_RELEASE_SIGNING_KEY is not set in the release environment."
            echo "::error::Generate one with packaging/make-signing-key.py -- see SECURITY.md."
            exit 1
          fi
          KEY_ID=$(python3 -c "
          import re, sys
          sys.path.insert(0, 'src')
          from pitrac_easy_connect.common import release_manifest as rm
          keys = rm._PINNED_KEYS
          if not keys:
              raise SystemExit('no key is pinned in _PINNED_KEYS yet')
          # This build must already trust the key it is about to sign with,
          # or every application in the field would refuse the release it
          # produces. There is deliberately only ever one pinned key during
          # ordinary operation; rotation adds a second before removing the
          # first, and this picks the newest.
          print(sorted(keys)[-1])
          ")
          umask 077
          printf '%s' "$PITRAC_RELEASE_SIGNING_KEY" > /tmp/release-signing-key.pem
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PI_ASSET=$(find release -maxdepth 1 -name '*.pyz')
          python3 packaging/write-release-manifest.py             --out release/release-manifest.json             --version "$VERSION" --tag "$TAG" --signing-key-id "$KEY_ID"             --asset release/PiTrac-Easy-Connect-macos-apple-silicon.zip             --asset release/PiTrac-Easy-Connect-macos-intel.zip             --asset release/PiTrac-Easy-Connect-windows.zip             --pi-asset "$PI_ASSET"
          python3 packaging/sign-release-manifest.py release/release-manifest.json             --key /tmp/release-signing-key.pem             --out release/release-manifest.json.sig
          shred -u /tmp/release-signing-key.pem 2>/dev/null || rm -f /tmp/release-signing-key.pem
          cat release/release-manifest.json

      # Signs the files themselves, keylessly, through Sigstore: the signature
      # records the workflow, repository and commit that built them, and is
      # checkable with `gh attestation verify`. This is not a code-signing
      # certificate -- it does not quiet SmartScreen or Gatekeeper -- but it is
      # what proves a download came from this repository's own build.
      - name: Sign the release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.pyz
            release/*-setup.exe
            release/release-manifest.json
            release/sbom-*.json

      # Every platform build wrote its own honest record of whether it
      # actually signed anything -- see release-signing-gate.py. Certificates
      # are optional, but a missing platform report means CI cannot vouch for
      # what shipped and keeps that release marked as a pre-release. The exact
      # signing state always goes into the public notes.
      - name: Record signing state and verify every platform reported
        run: |
          python packaging/release-signing-gate.py --status-dir artifacts --out /tmp/signing-gate.json
          echo "PRERELEASE=$(python -c "import json; print(str(json.load(open('/tmp/signing-gate.json'))['prerelease']).lower())")" \
            >> "$GITHUB_ENV"

      # The notes for a release are the message on its own tag, which is
      # where they are written. This used to point at a file named for
      # v0.4.6, so every release since carried v0.4.6's notes -- telling
      # people about upgrading from v0.4.5 no matter which version they had
      # just downloaded.
      - name: Assemble the release notes from this tag
        run: |
          mkdir -p /tmp/notes
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/notes/body.md
          if [ ! -s /tmp/notes/body.md ]; then
            echo "::error::${GITHUB_REF_NAME} has no annotation, so it has no notes."
            exit 1
          fi
          printf '\n\n' >> /tmp/notes/body.md
          cat .github/release-notes/download-and-verify.md >> /tmp/notes/body.md
          printf '\n\n### Code signing\n\n' >> /tmp/notes/body.md
          python -c "import json; print(json.load(open('/tmp/signing-gate.json'))['notes'])" \
            >> /tmp/notes/body.md
          echo "--- notes for ${GITHUB_REF_NAME} ---"
          head -20 /tmp/notes/body.md

      - name: Publish the release
        id: publish_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
          body_path: /tmp/notes/body.md
          prerelease: ${{ env.PRERELEASE }}

      # Both Windows files must remain public: people need the installer and
      # existing installations need the ZIP. Labels prevent the updater
      # payload from masquerading as a second manual download choice.
      - name: Label human downloads and internal updater payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          label_asset() {
            name="$1"
            label="$2"
            id=$(printf '%s' "$release" | jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .id')
            if [ -z "$id" ] || [ "$id" = null ]; then
              echo "::error::release asset is missing: $name"
              exit 1
            fi
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" \
              --raw-field "label=${label}" >/dev/null
          }
          label_asset "PiTrac-Easy-Connect-windows-setup.exe" \
            "Windows installer - download this"
          label_asset "PiTrac-Easy-Connect-windows.zip" \
            "Internal automatic-update payload - do not download manually"
          label_asset "PiTrac-Easy-Connect-macos-apple-silicon.zip" \
            "macOS installer - Apple silicon"
          label_asset "PiTrac-Easy-Connect-macos-intel.zip" \
            "macOS installer - Intel"

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so
      # without contents:read the checkout of a private repository fails with
      # "repository not found", which is what happened.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
