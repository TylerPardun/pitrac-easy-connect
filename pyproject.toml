[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitrac-easy-connect"
dynamic = ["version"]
description = "Wi-Fi setup, pairing, shot relay and a practice range for the PiTrac golf launch monitor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Deliberately empty. Everything shipped uses the Python standard library, so
# installing this on a Raspberry Pi needs no packages at all. What the packaged
# macOS and Windows apps bundle is a separate matter, described in NOTICE.md.
dependencies = []

# Not shipped, and not installed on the enclosure. These are what running the
# suite needs: the settings below run it in parallel, which is not something
# pytest can do on its own.
[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.scripts]
pitrac-easy-connect = "pitrac_easy_connect.pi.app:main"
pitrac-easy-connect-app = "pitrac_easy_connect.companion.app:main"
pitrac-easy-connect-demo = "pitrac_easy_connect.demo:main"
pitrac-ball-machine = "pitrac_easy_connect.ballmachine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Most of this suite waits on sockets and on services starting, so it
# parallelises almost perfectly. Every test builds its own servers on port 0
# and its own tmp_path, so nothing is shared between workers.
#
# This needs pytest-xdist, which is why there is a "test" extra above: without
# it these options are not merely ignored, pytest fails to start. Install with
#     python3 -m pip install -e ".[test]"
#
# --dist loadgroup places tests by the group tests/conftest.py assigns, which
# keeps each file on one worker and, for the socket-heavy files, keeps them
# from all running at once. See the comment there for why.
addopts = "-n auto --dist loadgroup"

[tool.setuptools.dynamic]
# One authoritative version, in the package itself. Repeating it here is how
# the release, the app and the packaging drift apart.
version = {attr = "pitrac_easy_connect.__version__"}
