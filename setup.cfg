[metadata]
name = pitrac-easy-connect
version = 0.1.0
description = Beginner-friendly network and simulator companion for PiTrac
license = GPL-2.0-only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pitrac-companion = pitrac_easy_connect.app:main
    pitrac-mock-gspro = pitrac_easy_connect.mock_simulators:gspro_main
    pitrac-mock-e6 = pitrac_easy_connect.mock_simulators:e6_main

