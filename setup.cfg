[metadata]
name = pitrac-easy-connect
version = 0.2.0
description = Beginner-friendly network and simulator companion for PiTrac
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pitrac-companion = pitrac_easy_connect.companion.app:main
    pitrac-easy-connect = pitrac_easy_connect.pi.app:main
    pitrac-easy-connect-demo = pitrac_easy_connect.demo:main
    pitrac-mock-gspro = pitrac_easy_connect.mock_simulators:gspro_main
    pitrac-mock-e6 = pitrac_easy_connect.mock_simulators:e6_main

